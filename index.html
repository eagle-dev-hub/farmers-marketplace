
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="stylesheet" href="style.css" />

  <title>Farmers Marketplace</title>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================== -->

  <header class="navbar">

    <div class="container nav-container">

      <div class="logo">
        <span class="logo-icon">🌱</span>
        Farmers Marketplace
      </div>

    </div>

  </header>


  <!-- =========================
       PRODUCT DETAIL
  ========================== -->

  <section id="product-detail"></section>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="container main-layout">


    <!-- =========================
         ADD PRODUCT
    ========================== -->

    <aside class="add-product-card">

      <h2>Add Product</h2>


      <!-- SEARCH + FILTER -->

      <div class="search-filter">

        <input
          id="search-input"
          type="search"
          placeholder="Search products..."
        />

        <select id="category-filter">

          <option value="all">
            All Categories
          </option>

          <option value="Fruit">
            Fruit
          </option>

          <option value="Vegetable">
            Vegetable
          </option>

          <option value="Cereal">
            Cereal
          </option>

        </select>

      </div>


      <!-- ADD PRODUCT FORM -->

      <form
        class="form"
        id="add-product-form"
        novalidate
      >

        <label class="image">

          Product Image:

          <input
            id="image"
            type="file"
            accept="image/*"
          />

        </label>


        <label for="category">
          Category:
        </label>

        <select
          id="category"
          required
        >

          <option value="">
            Select category
          </option>

          <option value="Fruit">
            Fruit
          </option>

          <option value="Vegetable">
            Vegetable
          </option>

          <option value="Cereal">
            Cereal
          </option>

        </select>


        <label>

          Product Name:

          <input
            id="product-name"
            type="text"
            placeholder="e.g. Onion"
            required
          />

        </label>


        <label>

          Quantity:

          <input
            id="quantity"
            type="text"
            placeholder="e.g. 500kg"
            required
          />

        </label>


        <label>

          Location:

          <input
            id="location"
            type="text"
            placeholder="e.g. Dessie"
            required
          />

        </label>


        <label>

          Price:

          <input
            id="price"
            type="text"
            placeholder="e.g. 500$"
            required
          />

        </label>


        <button
          class="add-btn"
          type="submit"
          id="submit-btn"
        >
          Add Product
        </button>

      </form>

    </aside>


    <!-- =========================
         PRODUCT LIST
    ========================== -->

    <section class="product-listing">

      <h2>
        Available Products
      </h2>

      <div
        class="product-grid"
        id="product-grid"
      ></div>

    </section>

  </main>


  <!-- =========================
       EDIT PRODUCT MODAL
  ========================== -->

  <section
    id="edit-modal"
    class="modal"
  >

    <div class="edit-modal-card">

      <button
        id="close-edit-modal"
        class="close-modal-btn"
        type="button"
      >
        X
      </button>


      <h2>
        Edit Product
      </h2>


      <form
        id="edit-form"
        class="form"
        novalidate
      >

        <label class="image">

          Product Image:

          <input
            id="edit-image"
            type="file"
            accept="image/*"
          />

        </label>


        <label for="edit-category">
          Category:
        </label>

        <select
          id="edit-category"
          required
        >

          <option value="">
            Select category
          </option>

          <option value="Fruit">
            Fruit
          </option>

          <option value="Vegetable">
            Vegetable
          </option>

          <option value="Cereal">
            Cereal
          </option>

        </select>


        <label>

          Product Name:

          <input
            id="edit-product-name"
            type="text"
            placeholder="e.g. Onion"
            required
          />

        </label>


        <label>

          Quantity:

          <input
            id="edit-quantity"
            type="text"
            placeholder="e.g. 500kg"
            required
          />

        </label>


        <label>

          Location:

          <input
            id="edit-location"
            type="text"
            placeholder="e.g. Dessie"
            required
          />

        </label>


        <label>

          Price:

          <input
            id="edit-price"
            type="text"
            placeholder="e.g. 500$"
            required
          />

        </label>


        <div class="edit-actions">

          <button
            type="button"
            id="cancel-edit"
            class="cancel-btn"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-btn"
          >
            Save Changes
          </button>

        </div>

      </form>

    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
