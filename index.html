
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Farmers Marketplace</title>
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="logo">
        <span class="logo-icon">🌱</span>
        Farmers Marketplace
      </div>
    </div>
  </header>

  <!-- Product Detail -->
  <section id="product-detail"></section>

  <main class="container main-layout">

    <!-- Sidebar -->
    <aside class="add-product-card">

      <h2>Add Product</h2>

      <!-- Search and Filter -->
      <div class="search-filter">

        <input
          id="search-input"
          type="search"
          placeholder="Search products..."
        />

        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Fruit">Fruit</option>
          <option value="Vegetable">Vegetable</option>
          <option value="Cereal">Cereal</option>
        </select>

      </div>

      <!-- Product Form -->
      <form class="form" novalidate>

        <label class="image">
          Product Image:
          <input
            id="image"
            type="file"
            accept="image/*"
          />
        </label>

        <label for="category">
          Category:
        </label>

        <select id="category" required>
          <option value="">Select category</option>
          <option value="Fruit">Fruit</option>
          <option value="Vegetable">Vegetable</option>
          <option value="Cereal">Cereal</option>
        </select>

        <label>
          Product Name:
          <input
            id="product-name"
            type="text"
            placeholder="e.g. Onion"
            required
          />
        </label>

        <label>
          Quantity:
          <input
            id="quantity"
            type="text"
            placeholder="e.g. 500kg"
            required
          />
        </label>

        <label>
          Location:
          <input
            id="location"
            type="text"
            placeholder="e.g. Dessie"
            required
          />
        </label>

        <label>
          Price:
          <input
            id="price"
            type="text"
            placeholder="e.g. 500$"
            required
          />
        </label>

        <button
          class="add-btn"
          type="submit"
          id="submit-btn"
        >
          Add Product
        </button>

      </form>

    </aside>

    <!-- Product Listing -->
    <section class="product-listing">

      <h2>Available Products</h2>

      <div
        class="product-grid"
        id="product-grid"
      ></div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
